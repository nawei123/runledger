name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tested MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          SHELL=/bin/sh bash /tmp/install-moonbit.sh '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, build, test and verify generated interface
        run: bash scripts/verify.sh
      - name: Test portable core
        run: moon test --target wasm-gc --deny-warn
      - name: Verify external audit, interruption recovery and integrity
        run: python3 scripts/test_external.py
      - name: Generate reproducible acceptance reports
        run: python3 scripts/acceptance.py
      - name: Check fault combinations against independent reference
        run: python3 scripts/check_invariants.py
      - name: Replay documented technical examples
        run: python3 scripts/review_evidence.py --date "$(TZ=Asia/Shanghai date +%F)"
      - name: Verify OpenTelemetry SDK interoperability
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/runledger-otel"
          "$RUNNER_TEMP/runledger-otel/bin/python" -m pip install -r requirements-interop.txt
          "$RUNNER_TEMP/runledger-otel/bin/python" scripts/interop_otel.py
